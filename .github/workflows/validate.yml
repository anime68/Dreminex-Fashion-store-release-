name: Dreminex Fashion validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android API 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Native source contracts
        run: python3 store_app_static_contract.py
      - name: Run unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest assembleDebug
