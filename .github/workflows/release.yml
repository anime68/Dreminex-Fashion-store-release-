name: Dreminex Fashion signed release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-and-release:
    environment: dreminex-fashion-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android API 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          code=$((major * 1000000 + minor * 1000 + patch))
          (( code > 0 && code <= 2100000000 ))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Test application source
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest
      - name: Prepare signed release APK
        id: apk
        shell: bash
        env:
          DREMINEX_FASHION_KEYSTORE_B64: ${{ secrets.DREMINEX_FASHION_KEYSTORE_B64 }}
          DREMINEX_FASHION_STORE_PASSWORD: ${{ secrets.DREMINEX_FASHION_STORE_PASSWORD }}
          DREMINEX_FASHION_KEY_ALIAS: ${{ secrets.DREMINEX_FASHION_KEY_ALIAS }}
          DREMINEX_FASHION_KEY_PASSWORD: ${{ secrets.DREMINEX_FASHION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          prebuilt="release-assets/${GITHUB_REF_NAME}/dreminex-fashion-release.apk"
          if [[ -f "$prebuilt" ]]; then
            cp "$prebuilt" dreminex-fashion-release.apk
            echo "mode=verified-prebuilt" >> "$GITHUB_OUTPUT"
          else
            test -n "$DREMINEX_FASHION_KEYSTORE_B64" || { echo "No prebuilt APK or release signing secrets are configured." >&2; exit 1; }
            test -n "$DREMINEX_FASHION_STORE_PASSWORD"
            test -n "$DREMINEX_FASHION_KEY_ALIAS"
            test -n "$DREMINEX_FASHION_KEY_PASSWORD"
            printf '%s' "$DREMINEX_FASHION_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dreminex-fashion.jks"
            chmod 600 "$RUNNER_TEMP/dreminex-fashion.jks"
            echo "DREMINEX_FASHION_KEYSTORE_PATH=$RUNNER_TEMP/dreminex-fashion.jks" >> "$GITHUB_ENV"
            ./gradlew --no-daemon assembleRelease -PstoreVersionName='${{ steps.version.outputs.name }}' -PstoreVersionCode='${{ steps.version.outputs.code }}'
            cp app/build/outputs/apk/release/app-release.apk dreminex-fashion-release.apk
            echo "mode=signed-source-build" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify APK identity, signature and create release manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="dreminex-fashion-release.apk"
          expected_cert="414e613021a0f78624487656483f3b32645acc61b4a46ccfd94d9410acc72e74"
          actual_cert="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$actual_cert" = "$expected_cert"
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")"
          package="$(printf '%s\n' "$badging" | sed -n "1s/^package: name='\([^']*\)'.*/\1/p")"
          apk_version_code="$(printf '%s\n' "$badging" | sed -n "1s/.*versionCode='\([^']*\)'.*/\1/p")"
          apk_version_name="$(printf '%s\n' "$badging" | sed -n "1s/.*versionName='\([^']*\)'.*/\1/p")"
          test "$package" = "com.dreminexfashion.store"
          test "$apk_version_name" = "${{ steps.version.outputs.name }}"
          test "$apk_version_code" = "${{ steps.version.outputs.code }}"
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          size="$(stat -c '%s' "$apk")"
          python3 - "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" "$sha" "$size" <<'PY'
          import json,sys
          repository,tag,version,code,sha,size=sys.argv[1:]
          manifest={"schema_version":1,"channel":"stable","version_name":version,"version_code":int(code),"package_name":"com.dreminexfashion.store","min_sdk":26,"apk":{"filename":"dreminex-fashion-release.apk","browser_download_url":f"https://github.com/{repository}/releases/download/{tag}/dreminex-fashion-release.apk","sha256":sha,"size_bytes":int(size)},"release_notes":f"Dreminex Fashion {version} update."}
          with open("update-manifest.json","w",encoding="utf-8") as f: json.dump(manifest,f,indent=2)
          PY
          printf '%s  %s\n' "$sha" "$apk" > checksums.sha256
          sha256sum -c checksums.sha256
      - name: Publish immutable release assets
        uses: softprops/action-gh-release@v3
        with:
          name: Dreminex Fashion v${{ steps.version.outputs.name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dreminex-fashion-release.apk
            update-manifest.json
            checksums.sha256
          generate_release_notes: true
